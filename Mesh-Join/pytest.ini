[pytest]
pythonpath = .
testpaths = tests
# importlib mode lets tests/unit and tests/integration both hold a file with the
# same name, since the test folders are not packages.
addopts = --import-mode=importlib
markers =
    integration: needs a real MySQL server; skipped unless the DWH_TEST_* environment variables are set
    slow: reads the whole raw data file or runs the whole pipeline
